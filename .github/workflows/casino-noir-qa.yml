name: Casino Noir quality gates
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-and-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate self-contained edition
        run: python build_standalone.py
      - name: Statistically verify selection and test profiles, geometry, UI and physics
        run: python tests/test_probabilities_and_profiles.py
      - name: Existing browser regressions
        run: |
          python tests/test_coast_and_highlight.py
          python tests/test_winner_options.py
          python tests/test_preview_visibility.py
          python tests/test_power_meter.py
          python tests/test_semantic_icon_search.py
      - name: Upload actual test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: casino-noir-failed-run-assets
          path: |
            casino-noir-*.png
            tests/*.png
          if-no-files-found: ignore

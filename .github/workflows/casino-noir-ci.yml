name: Casino Noir quality checks
on:
  pull_request:
    paths:
      - 'app.js'
      - 'card-engine.js'
      - 'deck-ui.js'
      - 'wheel-physics.js'
      - 'index.html'
      - 'styles.css'
      - 'casino-noir-standalone.html'
      - 'tests/**'
      - 'scripts/build-standalone.mjs'
      - '.github/workflows/casino-noir-ci.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js && node --check card-engine.js && node --check deck-ui.js && node --check wheel-physics.js && node --check tests/weighted-browser.mjs && node --check tests/regression-browser.mjs && node --check tests/pointer-browser.mjs && node --check tests/physics-browser.mjs
      - name: Deterministic card probability and persistence tests
        run: node tests/card-engine.mjs
      - name: Build current standalone from modular sources
        run: node scripts/build-standalone.mjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser regression and probability simulation
        run: node tests/card-decks-browser.mjs && node tests/physics-browser.mjs && node tests/pointer-browser.mjs && node tests/weighted-browser.mjs && node tests/regression-browser.mjs
